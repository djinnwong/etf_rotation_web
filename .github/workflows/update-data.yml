name: Update ETF data

on:
  schedule:
    # 14:30 Asia/Shanghai = 06:30 UTC.
    # Start early, fetch/calculate first, then wait until 14:55 before sending Telegram.
    - cron: "30 6 * * 1-5"
    # 15:03 Asia/Shanghai = 07:03 UTC.
    # Final run: use the official post-close weekly prices.
    # GitHub Actions scheduled jobs can start a few minutes late.
    - cron: "3 7 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "手动测试模式：preclose 会发送 Telegram，final 只更新正式收盘数据"
        required: true
        default: "preclose"
        type: choice
        options:
          - preclose
          - final

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update ETF data at 14:55 pre-close
        if: github.event.schedule == '30 6 * * 1-5' || github.event.inputs.mode == 'preclose'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/update_data.py --mode preclose --telegram --wait-until-preclose

      - name: Update ETF data at 15:03 final close
        if: github.event.schedule == '3 7 * * 1-5' || github.event.inputs.mode == 'final'
        run: python src/update_data.py --mode final

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv data/*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update ETF data"
            git push
          fi
